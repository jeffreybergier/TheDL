## Gemini CLI with Cross-Compilation Tools
# This compose file sets up the development environment for TheDL.
#
# Usage:
# Gemini Agent:     docker compose run --rm xcompile-gemini
# Xcompile Only:    docker compose run --rm xcompile-shell
# Full Release:     docker compose run --rm xcompile-shell make -C client release

services:
  # 1. Run Gemini Agent with full toolchain
  xcompile-gemini:
    build:
      context: .
      dockerfile: Containerfile
      target: xcompile-gemini
    image: xcompile-gemini
    volumes:
      - .:/app
      - ~/.gemini:/root/.gemini
      - ./.ssh:/root/.ssh
    command: gemini --yolo
    stdin_open: true
    tty: true

  # 2. Pure Cross-Compilation Shell (No Gemini)
  xcompile-shell:
    build:
      context: .
      dockerfile: Containerfile
      target: xcompile-base
    image: xcompile-base
    volumes:
      - .:/app
      - ./.ssh:/root/.ssh
    command: /bin/bash
    stdin_open: true
    tty: true
