## Handy Shortcuts
# This file is purely optional and just allows easy shortcuts
# for running all the function exposed in Docker.
# To see original commands or to use without compose,
# see Containerfile

# Launch standard Gemini (Fallback):
# docker compose run --rm plain-gemini gemini --yolo

# Launch Cross-Compile Gemini (Current):
# docker compose run --rm xcompile-gemini gemini --yolo

services:
  # 1. Run Gemini (Original Fallback)
  plain-gemini:
    build:
      context: .
      dockerfile: Containerfile
      target: plain-gemini
    image: plain-gemini
    volumes:
      - .:/app
      - ~/.gemini:/root/.gemini
    command: gemini --yolo
    stdin_open: true
    tty: true

  # 2. Run Gemini with Cross-Compilation Tools
  xcompile-gemini:
    build:
      context: .
      dockerfile: Containerfile
      target: xcompile-gemini
    image: xcompile-gemini
    volumes:
      - .:/app
      - ~/.gemini:/root/.gemini
    command: gemini --yolo
    stdin_open: true
    tty: true
